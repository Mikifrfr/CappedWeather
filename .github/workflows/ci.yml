name: CI

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCAPPEDWEATHER_REQUIRE_NETCDF=OFF -DCAPPEDWEATHER_REQUIRE_HDF5=OFF

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  honesty:
    # The honesty bar was culture. These gates are the mechanical part: static,
    # hermetic, no build, no Qt, no network, so they cannot be skipped for cost.
    # Each gate first runs a mutation self-test proving it can go red.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the claims gate diffs against the base commit

      - name: Gate self-test (a gate that cannot fail is not a gate)
        run: python3 tests/honesty_gate.py --self-test

      - name: Honesty gates
        env:
          HONESTY_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 tests/honesty_gate.py --base "$HONESTY_BASE"
