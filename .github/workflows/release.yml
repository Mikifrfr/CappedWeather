# Tagged releases (v*): portable Windows ZIP + portable Linux TGZ attached
# to the GitHub release. Windows ships its Qt runtime via windeployqt;
# Linux is bundled with linuxdeploy (built on Ubuntu 22.04 for glibc
# compatibility with newer distros).
name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          cache: true

      - name: Install BZip2
        run: vcpkg install bzip2:x64-windows

      - name: Configure
        run: >-
          cmake -S . -B build -A x64
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DCAPPEDWEATHER_REQUIRE_NETCDF=OFF

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package
        run: cpack --config build/CPackConfig.cmake -C Release

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: win-zip
          path: CappedWeather-*.zip

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: >
          sudo apt-get update &&
          sudo apt-get install -y --no-install-recommends
          libbz2-dev libgl1 libegl1 libxkbcommon0 libxkbcommon-x11-0
          libfontconfig1 libfreetype6 libdbus-1-3 libx11-xcb1 wget file

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          cache: true

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_PREFIX_PATH="$(qmake -query QT_INSTALL_PREFIX)"
          -DCAPPEDWEATHER_REQUIRE_NETCDF=OFF
          -DCAPPEDWEATHER_DEPLOY_QT=OFF
          -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Install to AppDir staging
        run: |
          rm -rf AppDir
          mkdir -p AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/256x256/apps
          DESTDIR="$PWD/AppDir" cmake --install build --prefix /usr
          cp packaging/CappedWeather.desktop AppDir/usr/share/applications/
          cp packaging/CappedWeather.png AppDir/usr/share/icons/hicolor/256x256/apps/

      - name: Fetch linuxdeploy (no FUSE on runners, extract instead)
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage
          ./linuxdeploy-x86_64.AppImage --appimage-extract >/dev/null
          mv squashfs-root linuxdeploy-root
          ./linuxdeploy-plugin-qt-x86_64.AppImage --appimage-extract >/dev/null
          mv squashfs-root linuxdeploy-plugin-qt-root
          # linuxdeploy discovers --plugin qt via an executable of that name on PATH.
          sudo ln -sf "$PWD/linuxdeploy-plugin-qt-root/AppRun" /usr/local/bin/linuxdeploy-plugin-qt

      - name: Bundle Qt runtime into AppDir
        # No --output plugin: with only --appdir, linuxdeploy fixes up the
        # tree in place (explicit --output appdir is not shipped by every
        # linuxdeploy build and fails with "Could not find plugin").
        run: |
          export QMAKE="$(which qmake)"
          ./linuxdeploy-root/AppRun --appdir AppDir \
            -d AppDir/usr/share/applications/CappedWeather.desktop \
            -i AppDir/usr/share/icons/hicolor/256x256/apps/CappedWeather.png \
            --plugin qt

      - name: Pack portable TGZ
        run: |
          # In-place deploy does not always leave a launcher; add a minimal
          # one when linuxdeploy did not.
          if [ ! -x AppDir/AppRun ]; then
            printf '%s\n' '#!/bin/sh' \
              'HERE="$(dirname "$(readlink -f "$0")")"' \
              'export LD_LIBRARY_PATH="$HERE/usr/lib:$LD_LIBRARY_PATH"' \
              'export QT_PLUGIN_PATH="$HERE/usr/plugins"' \
              'export QML2_IMPORT_PATH="$HERE/usr/qml"' \
              'exec "$HERE/usr/bin/CappedWeather" "$@"' > AppDir/AppRun
            chmod +x AppDir/AppRun
          fi
          tar czf "CappedWeather-${{ github.ref_name }}-Linux-x86_64.tgz" AppDir

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-tgz
          path: CappedWeather-*-Linux-x86_64.tgz

  publish:
    runs-on: ubuntu-latest
    needs: [windows, linux]
    steps:
      # gh release needs the git metadata to resolve the repository.
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true

      - name: Create release and attach packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -la packages
          gh release view "${{ github.ref_name }}" >/dev/null 2>&1 || \
            gh release create "${{ github.ref_name }}" \
              --title "CappedWeather ${{ github.ref_name }}" \
              --generate-notes
          gh release upload "${{ github.ref_name }}" packages/* --clobber
