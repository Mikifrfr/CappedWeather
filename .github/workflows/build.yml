name: build

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          cache: true

      - name: Install BZip2
        run: vcpkg install bzip2:x64-windows

      # CI installs only Qt + BZip2 (no netCDF), so stub the GLM L2 reader explicitly.
      - name: Configure
        run: >-
          cmake -S . -B build -A x64
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DCAPPEDWEATHER_REQUIRE_NETCDF=OFF
          -DCAPPEDWEATHER_REQUIRE_HDF5=OFF

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} --parallel

      - name: Test
        run: ctest --test-dir build -C ${{ matrix.build_type }} --output-on-failure

      - name: Package
        if: matrix.build_type == 'Release'
        run: cpack --config build/CPackConfig.cmake -C Release

      - name: Upload portable package
        if: matrix.build_type == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: CappedWeather-Windows
          path: CappedWeather-*.zip

  # Built on Ubuntu 22.04 so the portable package also runs on newer distros
  # (glibc is forward compatible). Debug+Release both build and test; only
  # Release is packaged.
  linux:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: >
          sudo apt-get update &&
          sudo apt-get install -y --no-install-recommends
          libbz2-dev libgl1 libegl1 libxkbcommon0 libxkbcommon-x11-0
          libfontconfig1 libfreetype6 libdbus-1-3 libx11-xcb1 wget file

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          cache: true

      # No netCDF or linuxdeploy here; plain build + tests. Portable
      # packaging happens in release.yml.
      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_PREFIX_PATH="$(qmake -query QT_INSTALL_PREFIX)"
          -DCAPPEDWEATHER_REQUIRE_NETCDF=OFF
          -DCAPPEDWEATHER_REQUIRE_HDF5=OFF
          -DCAPPEDWEATHER_DEPLOY_QT=OFF
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure
